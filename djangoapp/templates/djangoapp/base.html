{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Best Cars{% endblock %}</title>
    <meta name="description" content="Best Cars makes finding your next car simple and human.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'djangoapp/css/site.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg site-nav" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand brand-mark" href="{% url 'home' %}"><span>BEST</span> CARS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">About us</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'contact' %}">Contact us</a></li>
                    <li class="nav-item"><a class="btn btn-light nav-cta" href="{% url 'contact' %}">Talk to a specialist</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main>{% block content %}{% endblock %}</main>

    <footer class="site-footer">
        <div class="container d-flex flex-column flex-md-row justify-content-between gap-3">
            <div><a class="brand-mark footer-brand" href="{% url 'home' %}"><span>BEST</span> CARS</a><p class="mb-0 mt-2">Good cars. Clear choices. Better journeys.</p></div>
            <div class="footer-meta">Mon-Fri, 9am-6pm &nbsp;|&nbsp; (555) 014-2024</div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'djangoapp/js/site.js' %}"></script>
</body>
</html>
